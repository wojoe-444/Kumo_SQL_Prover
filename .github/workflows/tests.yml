name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    name: pytest (sqlglot 30.21.0 compiled, no benchmark floors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" "sqlglotc==30.21.0" --only-binary sqlglotc
      - name: Run the gate
        # Benchmark floors run on a schedule (benchmarks.yml); they report, they do not gate.
        run: python -m pytest -n auto -m "not eval" -q
